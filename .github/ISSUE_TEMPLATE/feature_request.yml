name: ✨ Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or situation first, then the solution you have in mind.
      placeholder: "When I mirror a game I'd like… because…"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: edition
    attributes:
      label: Edition you use
      options:
        - Free
        - Pro
        - Built from source
