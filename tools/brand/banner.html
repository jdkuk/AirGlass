<!doctype html>
<!-- 1280x640 README banner and GitHub social preview. Rendered by tools/brand/render.ps1. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #07080d; font-family: Inter, "Segoe UI", sans-serif; color: #f3f5fb; }
  .bg { position: absolute; inset: 0;
    background:
      radial-gradient(40% 60% at 10% 10%, rgba(63,77,255,.75), transparent 70%),
      radial-gradient(40% 60% at 95% 40%, rgba(155,60,255,.6), transparent 70%),
      radial-gradient(45% 50% at 55% 110%, rgba(0,166,200,.45), transparent 70%), #07080d; }
  .text { position: absolute; left: 84px; top: 150px; width: 800px; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 12px 40px -10px rgba(124,140,255,.8); }
  .brand span { font-size: 76px; font-weight: 800; letter-spacing: -0.03em; }
  h1 { margin: 34px 0 0; font-size: 40px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em;
    background: linear-gradient(120deg, #fff 10%, #c3c9ff 55%, #e5b9ff); -webkit-background-clip: text; color: transparent; }
  p { margin: 18px 0 0; font-size: 22px; color: #b4bad0; font-weight: 500; }
  .chips { margin-top: 30px; display: flex; gap: 10px; }
  .chips b { font-size: 17px; font-weight: 600; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); }
  img.win { position: absolute; right: 70px; top: 28px; height: 584px; transform: rotate(-3deg); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="text">
    <div class="brand"><img src="../../docs/images/icon.png" alt=""><span>AirGlass</span></div>
    <h1>AirPlay receiver for Windows</h1>
    <p>Screen Mirroring and lossless music from iPhone, iPad and Mac.</p>
    <div class="chips"><b>Liquid Glass</b><b>Apple Lossless</b><b>Open source</b></div>
  </div>
  <img class="win" src="../../docs/images/window-portrait.png" alt="">
</body>
</html>
